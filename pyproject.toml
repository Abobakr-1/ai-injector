[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-injector"
version = "1.0.0"
description = "Offensive prompt-injection testing harness for AI agents and chatbots (direct + indirect injection)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "AI Injector Contributors" }]
keywords = ["ai", "llm", "prompt-injection", "red-team", "security", "rag"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

dependencies = [
    "requests>=2.25",
    "PyYAML>=5.4",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
ai-injector = "ai_injector.cli:main"

[project.urls]
Homepage = "https://github.com/your-org/ai-injector"

[tool.setuptools]
packages = ["ai_injector", "ai_injector.modules"]

[tool.setuptools.package-data]
ai_injector = ["payloads/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
